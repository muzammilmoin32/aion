<!doctype html>
<html lang="en" dir="ltr" data-skin="night" data-lens="business" data-behind="off">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Aion Digital · Tilt</title>
  <meta name="description" content="A real Saudi banking journey running on a phone: SME onboarding with Nafath and Wathq, payroll, SADAD, cash-flow lending and Ai966 early warning, on the Aion layer.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../theme-dark.css">
  <link rel="stylesheet" href="../night.css">
  <link rel="stylesheet" href="../landing-d.css">
  <script src="../app.js" defer></script>
  <script src="../video-demo.js" defer></script>
  <script src="../glass-hero.js" defer></script>
  <script src="../landing-d.js" defer></script>
  <script src="../waves-settings.js" defer></script>
  <script src="../layouts.js" defer></script>
  <script src="../theme-dark.js" defer></script>
</head>
<body class="night tilt" data-base="../">
  <!-- ARABIC REVIEW: Arabic strings live in app.js, glass-hero.js and landing-d.js; a native Saudi reader must review them. -->
  <a class="skip" href="#main" data-d="skip">Skip to content</a>

  <svg class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="g-arc" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#45c3c7"/><stop offset=".55" stop-color="#009899"/><stop offset="1" stop-color="#12b3eb"/>
      </linearGradient>
    </defs>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5.5c0 4.6-3 7.9-7 9.5-4-1.6-7-4.9-7-9.5V6z"/><path d="M9 12l2 2 4-4"/></symbol>
    <symbol id="i-building" viewBox="0 0 24 24"><path d="M4 21V6l8-3 8 3v15"/><path d="M9 21v-4h6v4M8 9h2M14 9h2M8 13h2M14 13h2M2 21h20"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M16 5a3 3 0 0 1 0 6M18 14.6c1.8.6 3 2.4 3 5.4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h3"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.5v.01"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6.5 3.5h3l1.8 4.6-2.3 1.6a11 11 0 0 0 5.3 5.3l1.6-2.3 4.6 1.8v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.5 5.7a2 2 0 0 1 2-2.2z"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V11M10 20V5M16 20v-6M2 20h20"/></symbol>
    <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M6 2.5h12v19l-3-2-3 2-3-2-3 2z"/><path d="M9 7.5h6M9 11.5h6M9 15.5h3"/></symbol>
    <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4.2L4 8.5M4 4v4.5h4.5M4 13a8 8 0 0 0 14.5 4.2l1.5-1.7M20 20v-4.5h-4.5"/></symbol>
    <symbol id="i-bank" viewBox="0 0 24 24"><path d="M3 9.5L12 4l9 5.5M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20.5h18"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2.5L4.5 14H11l-1 7.5L19.5 10H13z"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M3.5 11.5L20.5 4l-7.5 17-2.3-7.2z"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M3 7l6.5 6.5 4-4L21 17M21 11.5V17h-5.5"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 19.5l1.3-3.8A8 8 0 1 1 8.5 19z"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6.5 9.5l5.5 5.5 5.5-5.5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
  </svg>

  <header class="site-header">
    <div class="bar">
      <a class="logo" href="#main">
        <img class="logo-light" src="../assets/logo-aion.png" alt="Aion Digital" width="1000" height="436">
        <img class="logo-dark" src="../assets/logo-aion-white.png" alt="Aion Digital" width="1000" height="436">
      </a>
      <div class="nav-panel" id="nav-panel">
        <nav class="nav" data-i18n-aria="primaryNav" aria-label="Primary">
          <ul class="nav-list">
            <li><a href="#journeys" data-d="navJ">Journeys</a></li>
            <li><a href="#layer" data-d="navL">The layer</a></li>
            <li><a href="#numbers" data-d="navN">Numbers</a></li>
            <li><a href="#deploy" data-d="navD">Deployment</a></li>
          </ul>
        </nav>
        <span class="npill mono"><span class="dot"></span><span data-d="pill">live inside a Top 5 Saudi bank</span></span>
        <div class="seg lens" role="group" data-i18n-aria="view" aria-label="View">
          <button type="button" data-lens="business" aria-pressed="true" data-i18n="business">Business view</button>
          <button type="button" data-lens="technical" aria-pressed="false" data-i18n="technical">Technical view</button>
        </div>
        <button type="button" class="btn btn-primary btn-book-m" data-open-booking data-i18n="book">Book a walkthrough</button>
      </div>
      <div class="seg langs" role="group" data-i18n-aria="language" aria-label="Language">
        <button type="button" data-lang="en" lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="ar" lang="ar" aria-pressed="false">عربي</button>
      </div>
      <button type="button" class="btn btn-primary btn-book" data-open-booking data-i18n="book">Book a walkthrough</button>
      <button type="button" class="menu-btn" aria-expanded="false" aria-controls="nav-panel">
        <span class="menu-icon" aria-hidden="true"></span><span class="sr-only" data-i18n="menu">Menu</span>
      </button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <h1 class="sr-only">Aion Digital</h1>
    <!-- HERO: glass stage, centred variant (7) -->
    <div id="heroes" data-versions="7" data-hero-id="hero"></div>

    <!-- 1 · journey wall: a tilted floor of cards that stands up as you scroll -->
    <section class="tsec fogzone" id="journeys" aria-labelledby="w-h">
      <div class="nwrap">
        <div class="shead"><div><span class="ntag reveal"><span class="dot"></span><span data-d="wTag"></span></span><h2 class="split" id="w-h" data-d="wH"></h2></div><p class="tlead reveal" data-d="wP"></p></div>
        <div class="wall-stage"><div class="wall" id="wall"></div></div>
      </div>
    </section>

    <!-- 2 · layer stack -->
    <section class="tsec fogzone" id="layer" aria-labelledby="l-h">
      <div class="nwrap stack-wrap">
        <div>
          <span class="ntag reveal"><span class="dot"></span><span data-d="lTag"></span></span>
          <h2 class="split" id="l-h" data-d="lH" style="margin-top:18px"></h2>
          <p class="tlead reveal" data-d="lP" style="margin:18px 0 26px"></p>
          <div class="stack-legend">
            <div class="legend-row reveal"><i></i><div><b data-d="g1"></b><span data-d="g1s"></span></div></div>
            <div class="legend-row mid reveal"><i></i><div><b data-d="g2"></b><span data-d="g2s"></span></div></div>
            <div class="legend-row reveal"><i></i><div><b data-d="g3"></b><span data-d="g3s"></span></div></div>
          </div>
        </div>
        <div class="stack-stage" aria-hidden="true">
          <div class="stack" id="stack">
            <div class="plate p-low" style="--k:-1"><span class="grid-dots"></span><span class="pl"><span data-d="pLow"></span><small data-d="pLowS"></small></span></div>
            <div class="plate p-mid" style="--k:0"><span class="grid-dots"></span><span class="pl"><span data-d="pMid"></span><small data-d="pMidS"></small></span></div>
            <div class="plate p-top" style="--k:1"><span class="grid-dots"></span><span class="pl"><span data-d="pTop"></span><small data-d="pTopS"></small></span></div>
          </div>
        </div>
      </div>
      <div class="nwrap"><p class="pull-q reveal" data-d="quote"></p></div>
    </section>

    <!-- 3 · tilted rails ribbons -->
    <div class="ribbons"><ul class="sr-only" id="rails-sr"></ul><div class="ribbon r1"></div><div class="ribbon r2"></div><button type="button" class="rib-pause" id="rib-pause" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-pause"/></svg><span class="sr-only" data-d="pause"></span></button></div>

    <!-- 4 · numbers that flip in -->
    <section class="tsec fogzone" id="numbers" aria-labelledby="n-h">
      <div class="nwrap">
        <div class="shead"><div><span class="ntag reveal"><span class="dot"></span><span data-d="nTag"></span></span><h2 class="split" id="n-h" data-d="nH"></h2></div><p class="tlead reveal" data-d="nP"></p></div>
        <div class="flips" id="flips"></div>
      </div>
    </section>

    <!-- 5 · pointer-tilt deployment cards -->
    <section class="tsec" id="deploy" aria-labelledby="d-h">
      <div class="nwrap">
        <div class="shead"><div><span class="ntag reveal"><span class="dot"></span><span data-d="dTag"></span></span><h2 class="split" id="d-h" data-d="dH"></h2></div><p class="tlead reveal" data-d="dP"></p></div>
        <div class="tcards" id="tcards"></div>
      </div>
    </section>

    <!-- 6 · tilting closing card -->
    <section class="tsec" id="contact" aria-labelledby="c-h">
      <div class="nwrap close-stage">
        <div class="close-card">
          <span class="mono" data-d="cNow"></span>
          <h2 id="c-h" data-d="cH"></h2>
          <p data-d="cP"></p>
          <div class="cc-ctas">
            <button type="button" class="btn" data-open-booking><svg class="ic" aria-hidden="true"><use href="#i-calendar"/></svg><span data-i18n="bookLong">Book a 20-minute walkthrough</span></button>
            <!-- Placeholder WhatsApp number -->
            <a class="btn ghost" href="https://wa.me/000000000000" target="_blank" rel="noopener"><svg class="ic" aria-hidden="true"><use href="#i-chat"/></svg><span data-i18n="whatsapp">Message us on WhatsApp</span></a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="dfoot"><div class="nwrap"><img src="../assets/logo-aion-white.png" alt="Aion Digital" width="1000" height="436"><span class="mono" data-d="foot"></span><span class="mono">© <span id="year"></span> Aion Digital</span></div></footer>

  <template id="hero-tpl">
    <section class="hero nhero" data-fit="off">
      <div class="hero-inner">
        <div class="hero-copy">
          <span class="ntag reveal-h"><span class="dot"></span><span class="n-chip"></span></span>
          <h2 class="copy-1"></h2>
          <p class="copy-2"></p>
          <p class="copy-3"></p>
          <div class="ctas">
            <button type="button" class="btn btn-primary btn-lg" data-open-booking><svg class="ic" aria-hidden="true"><use href="#i-calendar"/></svg><span data-i18n="bookLong">Book a 20-minute walkthrough</span></button>
            <a class="btn btn-ghost btn-lg" href="https://wa.me/000000000000" target="_blank" rel="noopener"><svg class="ic" aria-hidden="true"><use href="#i-chat"/></svg><span data-i18n="whatsapp">Message us on WhatsApp</span></a>
          </div>
          <p class="foot"></p>
        </div>

        <div class="hero-stage nstage">
          <div class="g3d">
            <div class="gback" aria-hidden="true"></div>
            <div class="gpanel" aria-hidden="true"></div>
            <!-- layer 1: the glass app window -->
            <div class="glayer gl1">
              <div class="g-top"><span class="mono g-name"></span><span class="mono g-steps"></span><span class="mono run">● <span class="g-run"></span></span></div>
              <div class="chips" role="group"></div>
              <div class="controls">
                <button type="button" class="behind-switch" role="switch" aria-checked="false">
                  <span class="sw-track" aria-hidden="true"><span class="sw-thumb"></span></span>
                  <span data-i18n="behind">Show what's behind it</span>
                </button>
                <button type="button" class="pause-btn" data-state="playing"><span aria-hidden="true"></span></button>
              </div>
              <div class="g-body">
                <div class="progress">
                  <div class="bar-track" aria-hidden="true"><span class="bar-fill"></span></div>
                  <ol class="steps"></ol>
                </div>
                <div class="trace-wrap">
                  <aside class="trace" aria-hidden="true" inert>
                    <div class="trace-head"><h3 class="trace-title" data-i18n="behindTitle">Behind the screen</h3><span class="live" aria-hidden="true"><i></i>LIVE</span></div>
                    <ol class="trace-list"></ol>
                    <p class="trace-note" data-i18n="traceNote"></p>
                  </aside>
                </div>
              </div>
            </div>
            <!-- layer 2: the phone floating in front of the glass -->
            <div class="glayer gl2">
              <div class="phone-area">
                <figure class="phone-fig" role="group">
                  <div class="phone-tilt">
                    <div class="phone">
                      <div class="phone-screen">
                        <video class="demo-media" data-demo-media muted playsinline loop autoplay preload="metadata" aria-hidden="true"></video>
                        <span class="vid-tag" aria-hidden="true" data-i18n="vidTag">Sample video</span>
                        <p class="phone-caption" aria-hidden="true"><span class="cap-dot"></span><span class="cap-t"></span></p>
                      </div>
                    </div>
                  </div>
                  <figcaption class="sr-only sr-caption"></figcaption>
                </figure>
              </div>
            </div>
            <!-- layer 3: floating cards, nearest to the viewer -->
            <div class="glayer gl3">
              <div class="kpi"></div>
              <div class="toast" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </template>

  <dialog id="booking" class="dialog" aria-labelledby="dlg-title">
    <div class="dlg-inner">
      <button type="button" class="dlg-x dlg-close" data-i18n-aria="close" aria-label="Close">×</button>
      <span class="dlg-ic" aria-hidden="true"><svg class="ic"><use href="#i-calendar"/></svg></span>
      <h2 id="dlg-title" data-i18n="dlgTitle">Book a 20-minute walkthrough</h2>
      <form method="dialog">
        <p data-i18n="dlgIntro">Two fields only, then the calendar.</p>
        <p class="dlg-note" data-i18n="dlgNote"></p>
        <label class="field-row">
          <span data-i18n="f1">[Field 1]</span>
          <input type="email" name="field1" required autocomplete="email">
        </label>
        <label class="field-row">
          <span data-i18n="f2">[Field 2]</span>
          <input type="text" name="field2" required autocomplete="organization">
        </label>
        <button type="submit" class="btn btn-primary btn-lg" data-i18n="submit">Continue to calendar</button>
      </form>
      <div class="dlg-done" hidden>
        <p data-i18n="done"></p>
        <button type="button" class="btn btn-ghost dlg-close" data-i18n="close">Close</button>
      </div>
    </div>
  </dialog>
</body>
</html>
